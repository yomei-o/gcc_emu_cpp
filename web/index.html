<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブラウザだけで C / C++</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1a1a1a; --bg: #fff; --panel: #f6f6f7; --line: #0002; --faint: #6b6b70;
    --accent: #2b6cb0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8e8ea; --bg: #16171a; --panel: #1e1f24; --line: #fff2; --faint: #9a9aa2; --accent: #7aa7d8; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  header {
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    padding: .5rem .8rem; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: .95rem; margin: 0 .5rem 0 0; font-weight: 600; }
  button, select, input[type=text] {
    font: inherit; padding: .3rem .7rem; border-radius: 5px;
    border: 1px solid var(--line); background: var(--bg); color: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=text] { cursor: text; }
  main { flex: 1; display: grid; grid-template-columns: 190px 1fr 1fr; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-auto-rows: minmax(200px, auto); } }
  aside, section { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  aside { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; }
  .side-title { padding: .5rem .7rem .2rem; font-size: .75rem; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .file { padding: .3rem .7rem; cursor: pointer; display: flex; justify-content: space-between; gap: .4rem; }
  .file:hover { background: var(--line); }
  .file.on { background: var(--accent); color: #fff; }
  .file .x { opacity: .5; }
  .file .x:hover { opacity: 1; }
  #editor {
    flex: 1; width: 100%; border: 0; resize: none; padding: .7rem .9rem;
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg); color: inherit; outline: none; tab-size: 4;
  }
  .right { border-left: 1px solid var(--line); }
  .tabs { display: flex; gap: .2rem; padding: .35rem .5rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tabs button { border: 0; background: transparent; padding: .25rem .6rem; border-radius: 4px; color: var(--faint); }
  .tabs button.on { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .pane { flex: 1; overflow: auto; padding: .7rem .9rem; display: none; }
  .pane.on { display: block; }
  #console { white-space: pre-wrap; font: 12.5px/1.5 ui-monospace, monospace; margin: 0; }
  #console .err { color: #d24; }
  #console .cmd { color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .6rem; }
  .note { color: var(--faint); font-size: .85rem; }
  #code { width: 100%; min-height: 11rem; font: 12px/1.5 ui-monospace, monospace;
          border: 1px solid var(--line); border-radius: 5px; padding: .5rem; background: var(--panel); color: inherit; }
  canvas { width: 100%; height: 340px; border: 1px solid var(--line); border-radius: 5px; margin-top: .6rem; background: var(--bg); }
  progress { width: 100%; height: 4px; }
  #status { color: var(--faint); font-size: .85rem; margin-left: auto;
            display: flex; align-items: center; gap: .45rem; }
  /* Something turning, because a compile is minutes of silence and a page that
     shows nothing is a page that has crashed, as far as anyone can tell. */
  .spin {
    width: .9rem; height: .9rem; flex: none; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: turn .8s linear infinite;
  }
  @keyframes turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
  /* The elapsed seconds, which say more than the spinner does once a minute has
     gone by: a student can see it is still counting. */
  #elapsed { font-variant-numeric: tabular-nums; }
  .ck { display: flex; gap: .3rem; align-items: center; font-size: .85rem; color: var(--faint); }
</style>

<header>
  <h1>ブラウザだけで C / C++</h1>
  <select id="project" title="プロジェクト"></select>
  <button id="new">新規</button>
  <button id="rename">名前</button>
  <button id="delete">削除</button>
  <span style="width:.6rem"></span>
  <button id="add">ファイル追加</button>
  <button id="upload">アップロード</button>
  <button id="download">ダウンロード</button>
  <span style="width:.6rem"></span>
  <select id="opt" title="最適化">
    <option value="-O0 -g -Wall">-O0 (デバッグ)</option>
    <option value="-O2 -Wall" selected>-O2</option>
    <option value="-O2 -Wall -Wextra">-O2 -Wextra</option>
  </select>
  <button id="run" class="primary">ビルドして実行</button>
  <button id="stop" hidden>中断</button>
  <span id="status"><span class="spin" id="spin" hidden></span><span id="statustext"></span><span id="elapsed"></span></span>
</header>
<progress id="bar" value="0" max="1" hidden></progress>

<main>
  <aside>
    <div class="side-title">ファイル</div>
    <div id="files"></div>
    <div class="side-title" style="margin-top:.6rem">できたもの</div>
    <div id="outputs"></div>
    <div class="side-title" style="margin-top:.6rem">保存</div>
    <div style="padding:.2rem .7rem .8rem" class="note">
      <label class="ck"><input type="checkbox" id="autosave" checked> 自動で保存</label>
      <div id="usage" style="margin-top:.3rem"></div>
    </div>
  </aside>

  <section>
    <textarea id="editor" spellcheck="false" placeholder="ファイルを選んでください"></textarea>
  </section>

  <section class="right">
    <div class="tabs">
      <button data-pane="out" class="on">出力</button>
      <button data-pane="chart">グラフ</button>
    </div>
    <div class="pane on" id="pane-out"><pre id="console"></pre></div>
    <div class="pane" id="pane-chart">
      <div class="row">
        <select id="csv"></select>
        <select id="ctype"></select>
        <select id="cx" title="横軸"></select>
        <button id="plot" class="primary">グラフを出す</button>
      </div>
      <div class="note">下の JavaScript がグラフを描いています。書き換えてボタンを押せば、そのとおりに描きます。</div>
      <textarea id="code" spellcheck="false"></textarea>
      <canvas id="canvas"></canvas>
    </div>
  </section>
</main>

<input type="file" id="picker" multiple hidden>
<script type="module" src="app.js"></script>
</html>
